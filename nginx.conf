# ── ToFilePath — nginx reverse proxy ────────────────────────────────────────
# Drop this into /etc/nginx/sites-available/tofilepath and symlink to
# /etc/nginx/sites-enabled/, then: nginx -t && systemctl reload nginx
#
# Key settings for large file uploads:
#   client_max_body_size   — must be ≥ backend limit (3 GB anon / 10 GB account)
#   proxy_request_buffering off — stream the body to Go directly; without this
#                                 nginx tries to buffer the whole file in tmp and
#                                 returns 413 even when the limit is high enough.
#   proxy_read_timeout     — 10 min so slow uploads don't time out mid-stream.

server {
    listen 80;
    server_name tofilepath.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tofilepath.ru;

    # ── SSL (Let's Encrypt / certbot) ────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tofilepath.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tofilepath.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Upload limits ─────────────────────────────────────────────────────────
    # Set to 11g to cover the 10 GB account limit + multipart overhead.
    client_max_body_size 11g;

    # CRITICAL: stream the request body to the backend instead of buffering it
    # on disk first.  Without this setting nginx will try to write the entire
    # file to a temp file before forwarding, which is slow and can fail with
    # 413 even when client_max_body_size is set correctly.
    proxy_request_buffering off;

    # ── Timeouts for large uploads (allow up to 10 minutes) ──────────────────
    proxy_connect_timeout  60s;
    proxy_send_timeout     600s;
    proxy_read_timeout     600s;
    send_timeout           600s;

    # ── Proxy to Go backend ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8085;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable response buffering so progress is streamed back in real time.
        proxy_buffering    off;
    }
}
